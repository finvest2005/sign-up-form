<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- <img src="./halie-west-25xggax4bSA-unsplash.jpg" alt="green-leaf-plant" /> -->
    <div class="credit">
      <div class="logo">
        <img src="./odin-lined.png" alt="Odin" />
        <p>ODIN</p>
      </div>
      <p class="footer">
        Photo by
        <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
        <a
          href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_content=creditShareLink&utm_medium=referral&utm_source=unsplash"
          >Unsplash</a
        >
      </p>
    </div>
    <form action="/xxx" class="container" method="post">
      <div class="header">
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
      </div>
      <div class="main">
        <p>Let's do this!</p>
        <div class="input-fields">
          <fieldset>
            <div class="first">
              <label for="first">FIRST NAME</label
              ><input type="text" name="first" id="first" />
            </div>
            <div class="last">
              <label for="last">LAST NAME</label
              ><input type="text" name="last" id="last" />
            </div>
          </fieldset>
          <fieldset>
            <div class="email">
              <label for="email">EMAIL</label
              ><input type="text" name="email" id="email" />
            </div>
            <div class="phone">
              <label for="phone">PHONE NUMBER</label
              ><input type="text" name="phone" id="phone" />
            </div>
          </fieldset>
          <fieldset>
            <div class="password">
              <label for="password">PASSWORD</label
              ><input type="text" name="password" id="password" />
            </div>
            <div class="confirm">
              <label for="confirm">CONFIRM PASSWORD</label
              ><input type="text" name="confirm" id="confirm" />
            </div>
          </fieldset>
        </div>
      </div>
      <div class="footer">
        <input type="submit" value="Create Account" />
        <p>Already have an account <a href="">Log in</a></p>
      </div>
    </form>
  </body>
</html>
